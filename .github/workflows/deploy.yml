name: "Build, Push and Deploy"

on:
  push:
    branches:
      - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  get-commit-metadata:
    uses: extrange/actions/.github/workflows/commit-metadata.yml@v1.5

  get-actions-vars:
    runs-on: ubuntu-latest
    outputs:
      s3_state_bucket: ${{ vars[steps.vars.outputs.s3] }}
      iam_role: ${{ vars[steps.vars.outputs.iam] }}

    steps:
      - name: Get S3 State Bucket and GHA IAM role variable names
        id: vars
        run: |
          REF=${{ github.ref_name }}
          echo "s3=${REF@U}_S3_STATE_BUCKET" >> "$GITHUB_OUTPUT"
          echo "iam=${REF@U}_GHA_IAM_ROLE" >> "$GITHUB_OUTPUT"

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Install Node.js and load pnpm from cache
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version-file: frontend/package.json
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Restore NextJS cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build
        run: |
          pnpm install
          pnpm build

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/out
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  deploy-backend:
    runs-on: ubuntu-latest
    needs:
      - get-commit-metadata
      - get-actions-vars
    env:
      TF_VAR_s3_state_bucket: ${{ needs.get-actions-vars.outputs.s3_state_bucket }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu.d/plugin-cache
    outputs:
      # These are named exactly after the opentofu outputs
      repository_name: ${{ steps.setup-infra.outputs.repository_name }}
      site_s3_bucket: ${{ steps.setup-infra.outputs.site_s3_bucket }}
      cloudfront_distribution_id: ${{ steps.setup-infra.outputs.cloudfront_distribution_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Read app settings
        id: settings
        run: |
          REF=${{ github.ref_name }}
          echo "APP_SETTINGS_B64=$(cat iac/backend/${REF}.env.yaml | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ needs.get-actions-vars.outputs.iam_role }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Restore provider cache
        id: cache-providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          # Rebuild cache whenever provider versions in the lockfile change
          key: ${{ runner.os }}-tofu-providers-${{ github.ref_name }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tofu-providers-

      - name: Setup ECR # Before we attempt to push the image
        id: setup-ecr
        working-directory: iac/
        env:
          TF_VAR_backend_image_tag: ${{ needs.get-commit-metadata.outputs.sha_short }}
        run: |
          tofu init -reconfigure -lockfile=readonly
          tofu apply \
            -auto-approve \
            -target 'module.ecr'
          tofu output -json -var-file="env-${{ github.ref_name }}.tfvars" | \
            jq -r 'to_entries[] | "\(.key)=\(.value.value|tostring)"' >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2

      - name: Get image tag
        id: image
        run: |
          BASE_TAG=${{ steps.login-ecr.outputs.registry }}/${{ steps.setup-ecr.outputs.repository_name }}
          TAG="$BASE_TAG:${{ needs.get-commit-metadata.outputs.sha_short }}"
          TAG_LATEST="$BASE_TAG:latest"

          {
            echo "tag=${TAG}"
            echo "tag_latest=${TAG_LATEST}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "# Image Tags"
            echo "\`${TAG}\`"
            echo "\`${TAG_LATEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # File mutations prior will be ignored, as we use the git commit as build context
      - name: Build, tag, and cache docker image to Amazon ECR
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6
        with:
          push: true
          build-args: |
            COMMIT_SHA=${{ needs.get-commit-metadata.outputs.sha_short }}
            COMMIT_TIMESTAMP=${{ needs.get-commit-metadata.outputs.timestamp }}
            APP_SETTINGS_B64=${{ steps.settings.outputs.APP_SETTINGS_B64 }}
          target: deployment
          context: "{{defaultContext}}:backend"
          platforms: linux/amd64
          cache-to: mode=max,image-manifest=true,oci-mediatypes=true,type=registry,ref=${{env.REGISTRY}}/${{ steps.setup-ecr.outputs.repository_name }}:cache
          cache-from: type=registry,ref=${{env.REGISTRY}}/${{ steps.setup-ecr.outputs.repository_name }}:cache
          provenance: false
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.tag_latest }}

      - name: Setup infrastructure
        id: setup-infra
        working-directory: iac/
        run: |
          tofu apply -auto-approve
          tofu output -json -var-file="env-${{ github.ref_name }}.tfvars" | \
            jq -r 'to_entries[] | "\(.key)=\(.value.value|tostring)"' >> "$GITHUB_OUTPUT"

      - name: Trigger App Runner Deployment
        run: |
          aws apprunner start-deployment --service-arn ${{ steps.setup-infra.outputs.app_runner_service_arn }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs:
      - build-frontend
      - get-actions-vars
      - deploy-backend
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build-frontend.outputs.artifact-id }}
          path: out

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ needs.get-actions-vars.outputs.iam_role }}

      - name: Sync to S3 and invalidate
        run: |
          aws s3 sync --delete out s3://${{ needs.deploy-backend.outputs.site_s3_bucket }}
          aws cloudfront create-invalidation --distribution-id ${{ needs.deploy-backend.outputs.cloudfront_distribution_id }} --paths "/*"
